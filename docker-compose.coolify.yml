# The whole platform for Coolify: PostgreSQL, the API, the web app, and Caddy
# in front for HTTPS on every address - the platform's own and each
# consultancy's custom domain (certificates issued on demand).
#
# Coolify setup (deploy/README.md, "Coolify", has the full steps):
#   - Coolify's proxy stays on: other apps on the server keep working, and it
#     passes this platform's addresses through to Caddy (labels on `caddy`);
#   - Build Pack "Docker Compose", Base Directory "/", Docker Compose Location
#     "/docker-compose.coolify.yml";
#   - leave every service's domain empty in Coolify: Caddy serves them all;
#   - the variables below appear in Coolify's Environment Variables tab.
#
# The difference from deploy/docker-compose.yml: every setting is passed by
# name (Coolify only hands a container the variables its compose file names),
# the Caddyfile is built into the image rather than mounted, and Caddy sits
# behind Coolify's proxy instead of holding ports 80/443 itself.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Karachi}
      PORT: 4000
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD:?}@db:5432/crm
      # Caddy puts the visitor's real address in X-Real-IP (and overwrites
      # anything a browser sent under that name).
      CLIENT_IP_HEADER: x-real-ip
      STORAGE_LOCAL_DIR: /app/storage
      MAIL_OUTBOX_DIR: /app/.data/outbox

      # Platform
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?}
      WEB_ORIGIN: ${WEB_ORIGIN:?}
      PUBLIC_IP: ${PUBLIC_IP:-}
      ADMIN_HOST: ${ADMIN_HOST:-}
      DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-}

      # Secrets (each: openssl rand -hex 32; never change them after launch)
      JWT_SECRET: ${JWT_SECRET:?}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:-}

      # Files: local, or s3 for Cloudflare R2 / S3 / B2
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}

      # Email: log (nothing is sent) or smtp
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}

      # SMS and WhatsApp: log or twilio
      MESSAGING_DRIVER: ${MESSAGING_DRIVER:-log}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
    volumes:
      - files:/app/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: web
      args:
        API_URL: http://api:4000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Karachi}
      API_URL: http://api:4000
    depends_on:
      - api

  # Behind Coolify's proxy, which keeps ports 80/443 for every app on the
  # server. The labels hand this Caddy the platform's own addresses - still
  # encrypted (TLS passthrough), so Caddy issues each certificate itself -
  # and nothing else. Consultancies' own domains are added in Coolify's proxy
  # settings: deploy/traefik-custom-domains.yml.
  #
  # The platform domain is written into the two rules below (dots escaped).
  # Using another domain? Change both.
  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: caddy-coolify
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      # https: the platform's addresses, passed through still encrypted, with
      # the visitor's address in a PROXY protocol header.
      - 'traefik.tcp.routers.studycrm-tls.rule=HostSNIRegexp(`^(.+\.)?studyconsultantcrm\.devx\.services`)'
      - traefik.tcp.routers.studycrm-tls.entrypoints=https
      - traefik.tcp.routers.studycrm-tls.tls.passthrough=true
      - traefik.tcp.routers.studycrm-tls.service=studycrm-tls
      - traefik.tcp.services.studycrm-tls.loadbalancer.server.port=443
      - traefik.tcp.services.studycrm-tls.loadbalancer.proxyprotocol.version=2
      # http: certificate challenges and the redirect to https.
      - 'traefik.http.routers.studycrm-http.rule=HostRegexp(`^(.+\.)?studyconsultantcrm\.devx\.services`)'
      - traefik.http.routers.studycrm-http.entrypoints=http
      - traefik.http.routers.studycrm-http.service=studycrm-http
      - traefik.http.services.studycrm-http.loadbalancer.server.port=80
    depends_on:
      - web
      - api

networks:
  coolify:
    external: true

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
